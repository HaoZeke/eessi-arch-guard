[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eessi-arch-guard"
version = "0.2.0"
description = "Reload an EESSI module environment when a Slurm task lands on another CPU or GPU target."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Goswami", email = "rgoswami@ieee.org" }]
requires-python = ">=3.9"
keywords = ["eessi", "slurm", "lmod", "hpc"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
eessi-arch-guard = "eessi_arch_guard:main"

[tool.setuptools]
py-modules = ["eessi_arch_guard"]
package-dir = { "" = "src" }

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.towncrier]
package = "eessi_arch_guard"
package_dir = "src"
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## [{version}] - {project_date}"
underlines = ["", "", ""]
issue_format = ""

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Docs"
showcontent = true
