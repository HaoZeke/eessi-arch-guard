name: pages
# Publish the Sphinx site to https://stackhands.github.io/eessi-arch-guard/
# from main. The docs job in ci.yml builds and checks it on every push.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: make -C docs html SPHINXOPTS="-W"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
