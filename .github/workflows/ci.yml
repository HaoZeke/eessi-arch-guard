name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # ubuntu-latest is 26.04, for which setup-python carries no 3.9 build.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what a Rocky 9 prolog host runs; pyproject says >=3.9.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: lint
        run: |
          python -m pip install ruff
          ruff check src tests
      - name: test
        run: python -m unittest discover -s tests -v

  zig:
    # The Zig build against the same Python suite, through TOOL_BIN.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # setup-zig checks the tarball's minisign signature against the Zig
      # project's key.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig fmt --check build.zig build.zig.zon zig
      - run: zig build test --summary all
      - run: zig build -Drelease=true
      - name: Python suite against the binary
        run: TOOL_BIN="$PWD/zig-out/bin/eessi-arch-guard" python -m unittest discover -s tests -v

  docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: build documentation
        run: |
          python -m pip install -r docs/requirements.txt
          make -C docs html
      - name: run documentation examples
        run: |
          python docs/examples/walkthrough.py mismatch
          python docs/examples/walkthrough.py again
          python docs/examples/walkthrough.py clean
          python docs/examples/failure_cases.py no-software-dir
          python docs/examples/failure_cases.py ignore-missing
          python docs/examples/failure_cases.py missing-module
          python docs/examples/failure_cases.py opt-out
          python docs/examples/failure_cases.py archdetect
          python docs/examples/failure_cases.py lmod
          python docs/examples/failure_cases.py verbose
          python docs/examples/failure_cases.py bad-timeout
          python docs/examples/shell_demo.py
          python docs/examples/accelerator.py mismatch
          python docs/examples/accelerator.py missing-module
          bash docs/examples/check_install.sh
          bash docs/examples/check_config.sh
