name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint
        run: |
          python -m pip install ruff
          ruff check src tests
      - name: test
        run: python -m unittest discover -s tests -v
