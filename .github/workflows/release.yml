name: release
# On a tag vX.Y.Z: build the static binaries, test each on its own
# architecture, check the version string against the tag, and publish the
# binaries with SHA256SUMS and build provenance attestations.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build test --summary all
      - name: Python suite against the binary
        run: zig build -Drelease=true && TOOL_BIN="$PWD/zig-out/bin/eessi-arch-guard" python3 -m unittest discover -s tests
      - name: build
        run: |
          zig build -Drelease=true -Dtarget=${{ matrix.arch }}-linux-musl --prefix out
          # --version prints the bare version, as the Python guard does.
          zon=$(sed -nE 's/^ *\.version = "([^"]+)".*/\1/p' build.zig.zon)
          if [ "${zon}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "versions: tag ${GITHUB_REF_NAME}, build.zig.zon ${zon}"; exit 1
          fi
          got=$(out/bin/eessi-arch-guard --version)
          py=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/eessi_arch_guard.py)
          if [ "${got}" != "${GITHUB_REF_NAME#v}" ] || [ "${py}" != "${got}" ]; then
            echo "versions: tag ${GITHUB_REF_NAME}, binary ${got}, Python ${py}"; exit 1
          fi
          mkdir dist
          cp out/bin/eessi-arch-guard "dist/eessi-arch-guard-${GITHUB_REF_NAME#v}-${{ matrix.arch }}-linux-musl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release notes are the tag's section of CHANGELOG.md, "## X.Y.Z"
      # or "## [X.Y.Z] - date"; a tag without one is not released.
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (on) exit; h = $0; sub(/^## \[?/, "", h); sub(/[] ].*$/, "", h); on = (h == v); next } on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then echo "CHANGELOG.md has no section for ${v}"; exit 1; fi
          cat release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum eessi-arch-guard-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --draft
